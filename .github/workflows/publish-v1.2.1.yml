name: Publish SlimeFinder V1.2.1
on:
  push:
    branches: [release/v1.2.1]

permissions:
  contents: read

concurrency:
  group: slimefinder-v1-2-1-release

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Assemble and verify staged assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release-build/fetch_assets.py
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  windows-smoke:
    needs: stage
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
      - name: Verify the Windows GUI launches
        shell: pwsh
        run: |
          $exe = Resolve-Path SlimeFinder_V1.2.1_Windows_x64.exe
          $name = [IO.Path]::GetFileNameWithoutExtension($exe)
          $launcher = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(45)
            do {
              if (Get-Process -Name $name -ErrorAction SilentlyContinue | Where-Object { $_.MainWindowTitle -match 'V1\.2\.1' }) {
                Write-Host 'Windows GUI V1.2.1 started'
                return
              }
              Start-Sleep -Milliseconds 350
            } while ([DateTime]::UtcNow -lt $deadline)
            $crash = Join-Path (Split-Path $exe) 'crash.log'
            if (Test-Path $crash) { Get-Content $crash }
            throw 'The packaged SlimeFinder GUI did not open on Windows.'
          } finally {
            Get-Process -Name $name -ErrorAction SilentlyContinue | Stop-Process -Force
          }

  publish:
    if: github.event.head_commit.message == 'Publish SlimeFinder V1.2.1 for Windows and Linux'
    needs: [stage, windows-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TARGET: 159ce2d6cd51fb299506671f966ec3c223e94e25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Verify the release assets and checksum manifest
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/SlimeFinder_V1.2.1_Windows_x64.exe
          test -s dist/SlimeFinder_V1.2.1_Linux_x86_64.tar.gz
          test -s dist/SlimeFinder_V1.2.1_CUDA_Source.zip
          gh release download V1.2 --repo "$GITHUB_REPOSITORY" --dir dist --pattern cubiomes_latest_26.2.zip
          printf '%s\n' '798512aea77dc4345643454cd92af2d1440e7dd311fd501a0f7dc134928aa8f3  cubiomes_latest_26.2.zip' >> dist/SHA256SUMS.txt
          (cd dist && sha256sum --check SHA256SUMS.txt)
      - name: Publish Windows, Linux, and CUDA source together
        shell: bash
        run: |
          set -euo pipefail
          if gh release view V1.2.1 --repo "$GITHUB_REPOSITORY" --json isDraft > release.json; then
            test "$(jq -r .isDraft release.json)" = true
            gh release upload V1.2.1 --clobber --repo "$GITHUB_REPOSITORY" dist/*
          else
            gh release create V1.2.1 --draft --repo "$GITHUB_REPOSITORY" --target "$RELEASE_TARGET" \
              --title 'SlimeFinder V1.2.1' --notes-file release-build/release-notes.md dist/*
          fi
          count=$(gh release view V1.2.1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets | length')
          test "$count" = 5
          gh release edit V1.2.1 --repo "$GITHUB_REPOSITORY" --draft=false --latest
