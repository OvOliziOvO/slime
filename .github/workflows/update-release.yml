name: Publish Release Binary

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  publish:
    if: github.event.head_commit.message == 'Publish release binary'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EXPECTED_SHA256: 8a723780a0b31c3f2dfecefd0283faddd28bd71f6a20a1063bc12af3e4a17d9f
    steps:
      - name: Download verified EXE
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 \
            -o "$RUNNER_TEMP/SlimeFinder_NVIDIA_10_50.exe" \
            'https://desktop-o3o0r2j.tail0ebd2e.ts.net/artifacts/public/3956bdc63121cd3a91c447452821891a/SlimeFinder_NVIDIA_10_50.exe?expires=1790920414&sig=e61ff06a279a009d1f74e97a206a51652deb0e5d511ab1089b997c7b149a3819'
          echo "$EXPECTED_SHA256  $RUNNER_TEMP/SlimeFinder_NVIDIA_10_50.exe" | sha256sum -c -

      - name: Replace release asset
        shell: bash
        run: |
          set -euo pipefail
          gh release upload V1.0.1 \
            "$RUNNER_TEMP/SlimeFinder_NVIDIA_10_50.exe" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"

      - name: Update release notes
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## 下载

          ### NVIDIA GPU

          **SlimeFinder_NVIDIA_10_50.exe**

          适用于 GTX 10 / RTX 20 / RTX 30 / RTX 40 / RTX 50。

          GPU 模式内置 CUDA 史莱姆搜索核心与 GPU 群系噪声后端，可直接执行 Deep Dark / Mushroom Fields 过滤。

          ### CPU 群系模式（可选）

          **cubiomes_latest_26.2.zip**

          CPU 模式的群系检查使用外置 cubiomes.dll。需要 CPU 群系过滤时，下载 ZIP 并将 cubiomes.dll 解压到 EXE 同目录。

          支持 Minecraft Java 1.19 ～ 26.2。

          CPU 模式调用外置 cubiomes；GPU 模式调用内置 GPU 后端，两条路径不会静默互相回退。

          ## 本版本更新

          - 更新 CUDA 史莱姆搜索核心
          - RTX 3060 Laptop GPU 全图搜索实测约 96 秒
          - 优化最终精准候选批处理
          - 加入 GPU Deep Dark / Mushroom Fields 精确过滤
          - GPU 群系批次根据显卡 occupancy 自适应
          - 群系排查显示批次耗时、候选数量、吞吐与 ETA
          - 减少高速批处理时无意义的 UI 状态刷新
          - 修复投影 / Y 范围相关问题

          ## 文件校验

          SlimeFinder_NVIDIA_10_50.exe

          SHA-256:
          8A723780A0B31C3F2DFECEFD0283FADDD28BD71F6A20A1063BC12AF3E4A17D9F

          > CPU 群系组件 cubiomes 为第三方项目；GPU 群系后端中的部分数据 / 相关实现参考遵循 cubiomes 的 MIT 许可证与原版权声明。
          EOF

          gh release edit V1.0.1 \
            --title "Slime Finder V1.0.1" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --repo "$GITHUB_REPOSITORY"
