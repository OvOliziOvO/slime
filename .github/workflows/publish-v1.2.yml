name: Publish SlimeFinder V1.2

on:
  push:
    branches: [release/v1.2]

permissions:
  contents: write

concurrency:
  group: slimefinder-v1-2-release

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TARGET: f30f8cf8a7c0594e5d0034ba4174cdc17376e2d2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Verify release files
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/slimefinder-v1.2"
          mkdir -p "$dist"
          gh release download V1.2-preview --repo "$GITHUB_REPOSITORY" --dir "$dist" \
            --pattern SlimeFinder_V1.2_Windows_x64.exe --pattern SlimeFinder_V1.2_CUDA_Source.zip
          gh release download V1.1 --repo "$GITHUB_REPOSITORY" --dir "$dist" \
            --pattern cubiomes_latest_26.2.zip
          cat > "$dist/SHA256SUMS.txt" <<'CHECKSUMS'
          9862062e776fec8b471e186e345427c44b541047244754ab7f3834d892fc74bb  SlimeFinder_V1.2_Windows_x64.exe
          295faa33a45c4cf0ab66c56933da4804533e952e678c2d56fe854890a5d294c5  SlimeFinder_V1.2_CUDA_Source.zip
          798512aea77dc4345643454cd92af2d1440e7dd311fd501a0f7dc134928aa8f3  cubiomes_latest_26.2.zip
          CHECKSUMS
          (cd "$dist" && sha256sum -c SHA256SUMS.txt)
      - name: Publish V1.2 as Latest
        shell: bash
        run: |
          set -euo pipefail
          dist="$RUNNER_TEMP/slimefinder-v1.2"
          gh release create V1.2 --repo "$GITHUB_REPOSITORY" --latest --target "$RELEASE_TARGET" \
            --title 'SlimeFinder V1.2' --notes-file release-build/V1.2-release-notes.md \
            "$dist/SlimeFinder_V1.2_Windows_x64.exe" "$dist/SlimeFinder_V1.2_CUDA_Source.zip" \
            "$dist/cubiomes_latest_26.2.zip" "$dist/SHA256SUMS.txt"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)" = V1.2
