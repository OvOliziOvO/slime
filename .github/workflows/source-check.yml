name: source-check

on:
  push:
  pull_request:

jobs:
  python-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Compile Python source
        run: python -m py_compile SlimeFinder.py tools/benchmark_gpu.py tools/benchmark_cpu.py tools/test_projection.py
